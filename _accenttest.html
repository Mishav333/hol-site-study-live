<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#221E19;--bone:#FCF8F5;--serif:"Cormorant Garamond",Georgia,serif}
body{background:var(--bone)}
.accent{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;background:#2B343B}
.accent img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.accent .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(34,30,25,0.46) 0%,rgba(34,30,25,0.20) 45%,rgba(34,30,25,0.10) 100%)}
.accent .quote{position:relative;z-index:2;color:var(--bone);text-align:left;max-width:620px;padding:3rem clamp(1.5rem,6vw,5rem)}
.accent .quote p{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1.25;letter-spacing:-.01em;max-width:19ch;margin:0;text-wrap:balance;text-shadow:0 2px 28px rgba(34,30,25,.6)}
</style></head><body>
<section class="accent">
  <img class="bg" src="assets/pages/plate-10.jpg">
  <div class="scrim"></div>
  <div class="quote"><p>More yourself in twenty years, not younger.</p></div>
</section>
</body></html>
